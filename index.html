<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giftly</title>
<!-- スマホのホーム画面に追加できるようにする設定 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#6a4fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giftly">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* レイアウト: スマホ1台分の縦長カラム。白地に紫のアクセント、下に4つのタブ */
:root{
  --bg:#f3f1f8;          /* 画面の外側 */
  --surface:#ffffff;     /* アプリの地 */
  --soft:#f6f4fb;        /* 入力欄やタイル */
  --ink:#26223a;
  --muted:#8a8699;
  --line:#ebe8f2;
  --accent:#6a4fd6;      /* 紫 */
  --accent-soft:#eeeafd;
  --pink:#e0567a;        /* バッジ「人気」・ハート */
  --orange:#e98a2f;      /* バッジ「おすすめ」 */
  --green:#2f9e6a;
  --thumb-s:65%; --thumb-l:93%; --icon-l:42%;
  --logo:"Pacifico",cursive;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121118;--surface:#1c1a24;--soft:#26232f;--ink:#efedf6;--muted:#9c98ab;--line:#2f2c3a;
  --accent:#9c86f5;--accent-soft:#2e2847;--pink:#f07a98;--orange:#f2a55c;--green:#5cc796;
  --thumb-s:30%;--thumb-l:24%;--icon-l:72%;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118;--surface:#1c1a24;--soft:#26232f;--ink:#efedf6;--muted:#9c98ab;--line:#2f2c3a;
  --accent:#9c86f5;--accent-soft:#2e2847;--pink:#f07a98;--orange:#f2a55c;--green:#5cc796;
  --thumb-s:30%;--thumb-l:24%;--icon-l:72%;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
button{font:inherit;color:inherit}
.app{max-width:440px;min-height:100%;margin:0 auto;background:var(--surface);position:relative;padding-bottom:84px;box-shadow:0 0 0 1px var(--line)}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 上部バー */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:10px;min-height:56px}
.bar h1{margin:0;text-align:center;font-size:17px;font-weight:700}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.dot{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;line-height:18px}
.logo{font-family:var(--logo);font-size:30px;color:var(--ink);line-height:1.2}

/* 共通部品 */
.searchbox{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);width:100%;cursor:text;text-align:left}
.searchbox input{border:0;background:transparent;font:inherit;color:var(--ink);flex:1;min-width:0;outline:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{margin:0;font-size:16px;font-weight:700}
.more{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pills.grid2{display:grid;grid-template-columns:1fr 1fr}
.pills.grid3{display:grid;grid-template-columns:repeat(3,1fr)}
.pills.grid2 .pill,.pills.grid3 .pill{padding:9px 6px;text-align:center}
.label{font-weight:700;font-size:14px;margin:20px 0 10px}
.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:14px;cursor:pointer;box-shadow:0 6px 16px -8px var(--accent)}
.primary:hover{filter:brightness(1.06)}
.ghost{display:block;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);font-size:13px;background:var(--surface)}
.thumb{background:hsl(var(--h) var(--thumb-s) var(--thumb-l));color:hsl(var(--h) 45% var(--icon-l));display:grid;place-items:center;border-radius:14px;position:relative;overflow:hidden}
.thumb svg.i{width:44%;height:44%;stroke-width:1.3}

/* スプラッシュ */
.splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding-block:40px;background:linear-gradient(170deg,#c89a6c 0%,#8b6446 60%,#5c4130 100%);color:#fff}
.splash .logo{color:#fff;font-size:56px}
.splash svg.i{width:56px;height:56px;stroke-width:1.2}
.splash p{font-size:18px;letter-spacing:.08em;margin:0 0 40px;line-height:1.9}
.splash .primary{background:#fff;color:#3b2a1e;max-width:300px;border-radius:999px;box-shadow:none}

/* ホーム */
.hero{margin-top:14px;border-radius:18px;padding:22px 20px;background:linear-gradient(120deg,hsl(28 60% 90%),hsl(340 60% 92%));color:#3b2a2e;display:grid;gap:8px;position:relative;overflow:hidden;cursor:pointer;border:0;text-align:left;width:100%}
.hero b{font-size:17px;line-height:1.6;max-width:13em}
.hero small{font-size:12px;opacity:.8}
.hero svg.i{position:absolute;right:-6px;bottom:-10px;width:110px;height:110px;stroke-width:1;color:hsl(350 45% 55%);opacity:.55}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scene{border:0;border-radius:16px;padding:14px 4px 10px;display:grid;justify-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:500;background:hsl(var(--h) var(--thumb-s) var(--thumb-l));color:var(--ink)}
.scene svg.i{width:30px;height:30px;color:hsl(var(--h) 50% var(--icon-l))}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-right:-18px}
.hscroll .pcard{flex:0 0 132px}
.diag{margin-top:22px;display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:var(--accent-soft);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left}
.diag .ic{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.diag b{display:block;font-size:14px}
.diag span{font-size:12px;color:var(--muted)}

/* シーン一覧 */
.slist{display:grid;gap:10px;margin-top:6px}
.srow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;cursor:pointer;text-align:left;width:100%}
.srow .thumb{width:68px;height:68px;flex:none}
.srow div.t{flex:1;min-width:0}
.srow b{display:block;font-size:15px}
.srow span{font-size:12px;color:var(--muted)}

/* 商品カード */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.pcard{border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0;display:grid;gap:6px;align-content:start}
.pcard .thumb{aspect-ratio:1/1;width:100%;max-width:100%}
.pcard .nm{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pr{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:700;color:#fff;padding:2px 8px;border-radius:6px;background:var(--pink)}
.badge.rec{background:var(--orange)}
.heart{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#8a8699;display:grid;place-items:center;cursor:pointer}
.heart svg.i{width:17px;height:17px;stroke-width:1.9}
.heart.on{color:#e0567a}.heart.on path{fill:currentColor}
.sortbar{display:flex;gap:8px;margin:4px 0 14px;overflow-x:auto}
.sortbar .pill{white-space:nowrap;padding:6px 14px;font-size:12px}
.manner{border-radius:14px;background:var(--soft);padding:12px 14px;margin-bottom:16px;font-size:12.5px}
.manner summary{cursor:pointer;font-weight:700;font-size:13px;list-style:none;display:flex;justify-content:space-between}
.manner summary::-webkit-details-marker{display:none}
.manner dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0}
.manner dt{color:var(--muted)}.manner dd{margin:0;min-width:0}
.empty{text-align:center;color:var(--muted);padding:40px 10px;display:grid;gap:12px;justify-items:center}
.empty svg.i{width:44px;height:44px;stroke-width:1.2;color:var(--accent)}

/* 商品詳細 */
.dhero{aspect-ratio:1/1;max-width:100%;border-radius:0;position:relative}
.dhero svg.i{width:38%;height:38%}
.dtop{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0}
.dtop .iconbtn{background:rgba(255,255,255,.85);color:#26223a;border-radius:50%}
.dtop .iconbtn.on{color:#e0567a}.dtop .iconbtn.on path{fill:currentColor}
.dbody{padding-block:18px 10px;display:grid;gap:12px}
.dbody h2{margin:0;font-size:19px;line-height:1.5}
.dprice{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.dprice small{font-size:12px;color:var(--muted);font-weight:400}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.feat.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.feat svg.i{width:20px;height:20px}
.tips{font-size:12.5px;background:var(--soft);border-radius:12px;padding:10px 12px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* カート */
.citem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.citem .thumb{width:76px;height:76px;flex:none}
.citem .t{flex:1;min-width:0;display:grid;gap:4px}
.citem .t span{font-size:13px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--accent)}
.qty button svg.i{width:14px;height:14px}
.qty b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink);resize:vertical;min-height:84px}
.counter{text-align:right;font-size:11px;color:var(--muted)}
.radio{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;margin-bottom:8px}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{accent-color:var(--accent)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 12px;font-weight:700}
.total b{font-size:20px;font-variant-numeric:tabular-nums}
.demo{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

/* マイページ */
.prof{display:flex;align-items:center;gap:14px;padding-block:10px 18px}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
.avatar svg.i{width:32px;height:32px}
.menu{display:grid}
.mrow{display:flex;align-items:center;gap:14px;padding:15px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left;width:100%}
.mrow span{flex:1}
.mrow em{font-style:normal;color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}
.status{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.status.done{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.odate{font-size:11px;color:var(--muted)}

/* 診断 */
.intro{border-radius:18px;background:var(--accent-soft);padding:22px;text-align:center;display:grid;justify-items:center;gap:10px;margin-top:6px}
.intro .ic{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.intro p{margin:0;font-size:13.5px;line-height:1.8}

/* 検索のカテゴリー */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{border:1px solid transparent;background:none;border-radius:14px;padding:8px 2px;cursor:pointer;display:grid;justify-items:center;gap:6px;font-size:11px}
.cat .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) var(--thumb-s) var(--thumb-l));color:hsl(var(--h) 50% var(--icon-l))}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* 下のタブ */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:10}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--muted);cursor:pointer;padding:4px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] svg.i{stroke-width:2.2}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;transition:opacity .2s;max-width:calc(100% - 32px)}
.note{font-size:11px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ここから楽天との連携用 */
body{margin:0}
[hidden]{display:none!important}
label.label{display:block}
.thumb img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.rklist{display:grid;gap:10px}
.rkitem{display:flex;gap:6px;border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}
.rkitem > a{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-decoration:none;color:var(--ink)}
.wbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.wbtn svg.i{width:19px;height:19px}
.wbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wimg{width:76px;height:76px;border-radius:14px;object-fit:cover;flex:none;background:#fff}
.wthumb{border:0;padding:0;background:none;cursor:pointer;width:76px;height:76px;flex:none}
.citem .nm2{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.buy{justify-self:start;margin-top:4px;font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px;text-decoration:none;background:#bf0000;color:#fff}
.buy.ghostbuy{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
svg.i.inl{width:16px;height:16px;vertical-align:-3px}
.buy.y{background:#ff0033}
.src{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px;background:#bf0000}
.src.y{background:#ff0033}
.stars{color:#f0a020;letter-spacing:-1px}
.slsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.slsum div{background:var(--soft);border-radius:12px;padding:8px 6px;text-align:center;display:grid;gap:1px}
.slsum span{font-size:10.5px;color:var(--muted)}
.slsum b{font-size:13px;font-variant-numeric:tabular-nums}
.more-btn{width:100%;cursor:pointer;font-weight:700;color:var(--accent)}
.shoplist{display:grid;gap:10px}
.rnum{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);margin-right:6px}
.rankno{position:absolute;top:6px;left:6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:#8a8699;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.rankno.r1{background:#d4a017}.rankno.r2{background:#9aa3ad}.rankno.r3{background:#b8763e}
.rkwish{position:absolute;top:6px;right:6px;width:32px;height:32px;background:rgba(255,255,255,.9);color:#8a8699}
.rkwish.on{background:var(--accent);color:#fff}
.pcard .meta{font-size:11px;color:var(--muted)}
.rkitem img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;background:#fff}
.rkitem .t{min-width:0;display:grid;gap:2px}
.rkitem .nm{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rkitem .meta{font-size:11px;color:var(--muted)}
.field{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink)}
.credit{font-size:11px;text-align:center;margin-top:18px}
.credit a{color:var(--muted)}
.hero-ph{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:96px;height:96px;border-radius:14px;overflow:hidden;display:none;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.hero-ph img.ph{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.hero:has(.hero-ph img){padding-right:124px}
.hero:has(.hero-ph img) .hero-ph{display:block}
.hero:has(.hero-ph img) > svg.i{display:none}
.diag + .sec, .hero + .diag{margin-top:14px}
.today{font-size:13px;color:var(--muted);margin:0 0 10px}
.today b{color:var(--ink);font-size:16px}
.evs{display:flex;gap:10px;overflow-x:auto;margin-right:-18px;padding-bottom:6px;scrollbar-width:none}
.ev{flex:0 0 124px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:left;cursor:pointer;display:grid;gap:4px;align-content:start}
.ev .dt{font-size:11px;color:var(--muted)}
.ev b{font-size:14px;line-height:1.4}
.ev .left{justify-self:start;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px}
.ev.add{border-style:dashed;color:var(--muted);justify-items:center;text-align:center;font-size:12px;align-content:center}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
select.field{cursor:pointer}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.setrow > span{display:flex;align-items:center;gap:10px}
.seg3{display:flex;gap:6px}
.seg3 .pill{padding:6px 12px;font-size:12px}
/* いま話題 */
.seg4{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg4 .pill{white-space:nowrap;padding:7px 14px;font-size:12.5px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.vrow .vcard{flex:0 0 200px}
.vcard{position:relative;min-width:0}
.vcard > a{display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.vthumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--soft)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .play{position:absolute;left:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.vthumb .play svg.i{width:14px;height:14px;fill:#fff;stroke:none}
.vcard .nm2,.acard .nm2{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard .meta,.acard .meta{font-size:11px;color:var(--muted)}
.vcard .favxbtn{position:absolute;top:6px;right:6px}
.favxbtn{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.favxbtn svg.i{width:17px;height:17px;stroke-width:1.9}
.favxbtn.on{color:#e0567a;border-color:#e0567a}.favxbtn.on path{fill:currentColor}
.acard{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.acard > a{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-decoration:none;color:var(--ink)}
.acard img,.acard .aimg{width:88px;height:66px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
.acard .t{display:grid;gap:3px;min-width:0}
.users{color:#e0567a;font-weight:700}
.vopen{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:grid;gap:4px;color:var(--ink);width:100%;font:inherit}
.aopen{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;flex:1;min-width:0;color:var(--ink);font:inherit}
.vtag{position:absolute;right:8px;bottom:8px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(106,79,214,.92);padding:2px 8px;border-radius:6px}
.ytwrap{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vitem{display:grid;gap:6px}
.vname{font-size:13px;font-weight:700;line-height:1.5}
.vtag2{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 6px;margin-right:6px;background:var(--soft);color:var(--muted)}
.vtag2.ok{background:var(--accent);color:#fff}
.sc-ph{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden}
.sc-ph img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
</style>
</head>

// 検索・診断の条件（画面をまたいで覚えておく）
const q = {kw:"", min:"", max:"", cat:"", wrap:""};
// 検索条件の予算（下限と上限が逆なら入れかえる）
function qRange(){
  const a = +q.min || 0, b = q.max === "" ? Infinity : +q.max;
  return a <= b ? [a, b] : [b, a];
}
// 検索条件 → 楽天で探すときの条件
function searchParams(){
  const c = CATS.find(x => x.id === q.cat), [lo, hi] = qRange();
  const p = {keyword: [q.kw.trim(), c && c.rk].filter(Boolean).join(" ") || "ギフト"};
  if (lo > 0) p.minPrice = lo;
  if (hi < Infinity) p.maxPrice = hi;
  if (q.wrap === "yes") p.giftFlag = 1;
  return p;
}

const WEEK = "日月火水木金土";

// これからのイベント（決まった行事＋自分で登録した記念日）を近い順に
function upcoming(){
  const now = new Date(); now.setHours(0,0,0,0);
  const nth = (y,m,wd,n) => { const d = new Date(y,m,1); const off = (wd - d.getDay() + 7) % 7; return new Date(y,m,1+off+7*(n-1)); };
  const evs = y => [
    {n:"バレンタイン", d:new Date(y,1,14), s:"valentine"},
    {n:"ホワイトデー", d:new Date(y,2,14), s:"whiteday"},
    {n:"母の日", d:nth(y,4,0,2), s:"mother"},
    {n:"父の日", d:nth(y,5,0,3), s:"father"},
    {n:"お中元", d:new Date(y,6,1), s:"seasonal"},
    {n:"敬老の日", d:nth(y,8,1,3), s:"keiro"},
    {n:"お歳暮", d:new Date(y,11,1), s:"seasonal"},
    {n:"クリスマス", d:new Date(y,11,25), s:"xmas"},
    ...annivs.map(a => ({n:a.name, d:new Date(y,a.m-1,a.d), s:a.s || "", kw:a.s ? "" : "プレゼント ギフト", mine:true})),
  ];
  const y = now.getFullYear();
  return [...evs(y), ...evs(y+1)].filter(e => e.d >= now).sort((a,b) => a.d - b.d)
    .map(e => ({...e, days: Math.round((e.d - now)/86400000), label: `${e.d.getMonth()+1}月${e.d.getDate()}日`}));
}

// ================= ショッピングサイトとの連携 =================
// 楽天市場・Yahoo!ショッピングへの問い合わせは、Cloudflare Workers に置いた中継サーバーを通す。
// 各サイトのIDやキーは中継サーバー側にだけ保存してあり、このファイルには入っていない。
const API_BASE = "https://giftly-api.shogoganbaru0520.workers.dev";   // 中継サーバーのアドレス
const RK = { ready(){ return !!API_BASE; } };
const SOURCES = {
  r: {name:"楽天", path:"/search", buy:"楽天で購入する",
      credit:`<a href="https://webservice.rakuten.co.jp/" target="_blank" rel="noopener">Supported by Rakuten Developers</a>`},
  y: {name:"Yahoo!", path:"/yahoo", buy:"Yahoo!で購入する",
      credit:`<a href="https://developer.yahoo.co.jp/sitemap/" target="_blank" rel="noopener">Webサービス by Yahoo! JAPAN</a>`},
};
let yahooOn = true;   // 中継サーバーにYahoo!のIDが登録されていなければ false になる
const PER_PAGE = 30;  // 1回に取ってくる数

// サイトから届いた文字をそのまま画面に入れないための変換
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function apiGet(path, p){
  return fetch(API_BASE + path + "?" + new URLSearchParams(p))
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(d => d.error ? Promise.reject(new Error(d.error)) : d);
}

// 1秒に1回までのルールを守るため、サイトごとに順番待ちの列に並べて呼ぶ。結果は1日だけ覚えておく
//   prio … true なら列の先頭に割りこむ（商品の一覧はこちら。写真は後回し）
//   need … 順番が来たときにまだ必要か（画面から消えた写真は取りに行かない）
const jobs = {r: [], y: []}, busy = {r: false, y: false};
function enqueue(src, fn, prio, need){
  return new Promise((resolve, reject) => {
    const job = {fn, resolve, reject, need};
    prio ? jobs[src].unshift(job) : jobs[src].push(job);
    pump(src);
  });
}
function pump(src){
  if (busy[src] || !jobs[src].length) return;
  const j = jobs[src].shift();
  if (j.need && !j.need()) { j.reject(new Error("skipped")); return pump(src); }
  busy[src] = true;
  j.fn().then(j.resolve, j.reject).finally(() => setTimeout(() => { busy[src] = false; pump(src); }, 1100));
}
const pending = {};
function shopSearch(params, src = "r", prio = false, need = null){
  const p = {hits: PER_PAGE, ...params};
  const cacheKey = "rkc-" + src + JSON.stringify(p);
  const hit = load(cacheKey, null);
  if (hit && Date.now() - hit.t < 86400000) return Promise.resolve(hit.d);
  if (pending[cacheKey]) return pending[cacheKey];
  const job = enqueue(src, () => apiGet(SOURCES[src].path, p), prio, need)
    .then(d => {
      if (d.disabled) { if (src === "y") yahooOn = false; return {items: [], disabled: true}; }
      const items = (d.Items || d.items || []).map(it => norm(it, src));
      const data = {items};
      save(cacheKey, {t: Date.now(), d: data});
      return data;
    })
    .finally(() => delete pending[cacheKey]);
  return pending[cacheKey] = job;
}
const rkSearch = (params, need) => shopSearch(params, "r", false, need);
// サイトから届いた商品データを、アプリの中で使う形にそろえる
const norm = (it, src) => ({
  itemName: it.itemName, itemPrice: Number(it.itemPrice) || 0, itemUrl: it.itemUrl, url: it.affiliateUrl || it.itemUrl,
  img: it.img || rkImg(it), reviewAverage: Number(it.reviewAverage) || 0, reviewCount: Number(it.reviewCount) || 0,
  shopName: it.shopName || "", rank: Number(it.rank) || 0, src,
});
// 楽天の画像のURLを大きいサイズに変える
function rkImg(it){
  const u = (it.mediumImageUrls || [])[0];
  const s = typeof u === "string" ? u : u && u.imageUrl;
  return s ? s.replace(/_ex=\d+x\d+/, "_ex=400x400") : "";
}
// 贈り物の候補 → ショッピングサイトで探すときの言葉と価格の幅
const giftParams = g => ({keyword: g.name.replace(/（.*?）/g, "").trim() + " ギフト", minPrice: Math.round(g.price*0.5), maxPrice: Math.round(g.price*2)});
// （一覧の1ページ目と同じ条件にして、同じ結果を使い回す）
const giftItems = (g, need) => rkSearch({...giftParams(g), sort: "-reviewCount", page: 1}, need);

// 画面に出した商品を覚えておく（ほしいものリストのボタン用）
const rkReg = [];
const stars = v => "★".repeat(Math.round(v)) + "☆".repeat(5 - Math.round(v));
const rkCard = it => {
  const n = rkReg.push(it) - 1, on = inWish("r:" + it.itemUrl);
  return `<div class="rkitem"><a href="${esc(it.url)}" target="_blank" rel="noopener">
  <img src="${esc(it.img)}" alt="" loading="lazy">
  <div class="t"><span class="nm">${it.rank ? `<span class="rnum">${it.rank}位</span>` : ""}<span class="src ${it.src}">${SOURCES[it.src].name}</span>${esc(it.itemName)}</span><b>${yen(it.itemPrice)}</b>
  <span class="meta">${it.reviewCount ? `<span class="stars">${stars(it.reviewAverage)}</span> ${it.reviewAverage.toFixed(1)}（${it.reviewCount.toLocaleString()}件）・` : "レビューなし・"}${esc(it.shopName)}</span></div></a>
  <button class="wbtn ${on ? "on" : ""}" data-act="wishr" data-n="${n}" aria-pressed="${on}" aria-label="ほしいものリストに追加">${ic("gift")}</button></div>`;
};

// 画面を作り直しても読み込んだ商品を覚えておけるよう、条件ごとに状態を持つ
const SL = {};
const API_SORT = {pop: "-reviewCount", rate: "-reviewAverage", low: "+itemPrice", high: "-itemPrice"};
function shopList(params, title){
  const id = "sl-" + Math.abs([...JSON.stringify(params)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7));
  if (!SL[id]) SL[id] = {params, sort: "pop", star: false, src: "all", items: [], page: 0, done: {r: false, y: false}, loading: false, error: false};
  return `<div class="label" style="margin-bottom:8px">${title}</div><div class="shoplist" id="${id}"></div>`;
}
// 並べかえたときは最初から読み直す（読み込み途中の古い結果は gen で見分けて捨てる）
function slReset(st){ Object.assign(st, {items: [], page: 0, done: {r: false, y: false}, error: false, loading: false, gen: (st.gen || 0) + 1}); }
function slMore(id){
  const st = SL[id]; if (!st || st.loading) return;
  st.loading = true; slDraw(id);
  const gen = st.gen;
  const page = st.page + 1, srcs = ["r", ...(yahooOn ? ["y"] : [])].filter(s => !st.done[s]);
  // 安い順のとき、1円などのギフトに向かない商品が並ばないよう、下限がなければ500円からにする
  const params = st.sort === "low" && !st.params.minPrice ? {...st.params, minPrice: 500} : st.params;
  Promise.allSettled(srcs.map(s => shopSearch({...params, sort: API_SORT[st.sort], page}, s, true).then(d => [s, d])))
    .then(rs => {
      if (st.gen !== gen) return;
      let ok = 0;
      rs.forEach((r, i) => {
        if (r.status !== "fulfilled") { st.done[srcs[i]] = true; if (srcs[i] === "y") yahooOn = false; return; }
        ok++;
        const [s, d] = r.value;
        // 楽天は1回30件ちょうど返す。Yahoo!は「ふるさと納税」を除くので少し減ることがある
        if (d.disabled || d.items.length < (s === "y" ? 1 : PER_PAGE)) st.done[s] = true;
        const seen = new Set(st.items.map(x => x.itemUrl));
        st.items.push(...d.items.filter(x => !seen.has(x.itemUrl)));
      });
      if (!ok) { st.error = true; srcs.forEach(s => st.done[s] = true); }
      st.page = page; st.loading = false; slDraw(id);
    });
}
function slDraw(id){
  const el = document.getElementById(id), st = SL[id];
  if (!el || !st) return;
  // 並べかえと絞りこみ
  let list = st.items.filter(it => (st.src === "all" || it.src === st.src) && (!st.star || it.reviewAverage >= 4));
  const by = {pop: (a,b) => b.reviewCount - a.reviewCount, rate: (a,b) => (b.reviewAverage - a.reviewAverage) || (b.reviewCount - a.reviewCount),
              low: (a,b) => a.itemPrice - b.itemPrice, high: (a,b) => b.itemPrice - a.itemPrice}[st.sort];
  list = [...list].sort(by);
  // 価格帯と口コミのまとめ
  const prices = st.items.map(x => x.itemPrice).filter(Boolean).sort((a,b) => a-b);
  const reviewed = st.items.filter(x => x.reviewCount);
  const avg = reviewed.length ? reviewed.reduce((s,x) => s + x.reviewAverage, 0) / reviewed.length : 0;
  const summary = prices.length ? `<div class="slsum">
      <div><span>最安</span><b>${yen(prices[0])}</b></div>
      <div><span>中央</span><b>${yen(prices[Math.floor(prices.length/2)])}</b></div>
      <div><span>最高</span><b>${yen(prices[prices.length-1])}</b></div>
      <div><span>平均評価</span><b>${avg ? "★" + avg.toFixed(1) : "—"}</b></div>
    </div>` : "";
  const nR = st.items.filter(x => x.src === "r").length, nY = st.items.filter(x => x.src === "y").length;
  const pill = (act, v, label, on) => `<button class="pill" data-act="${act}" data-id="${id}" data-v="${v}" aria-pressed="${on}">${label}</button>`;
  const controls = st.items.length ? `<div class="sortbar">
      ${[["pop","人気順"],["rate","評価が高い順"],["low","安い順"],["high","高い順"]].map(([k,n]) => pill("slsort", k, n, st.sort === k)).join("")}
      ${pill("slstar", "", "★4以上", st.star)}
    </div>
    ${nY ? `<div class="sortbar">${pill("slsrc","all",`すべて ${st.items.length}`, st.src==="all")}${pill("slsrc","r",`楽天 ${nR}`, st.src==="r")}${pill("slsrc","y",`Yahoo! ${nY}`, st.src==="y")}</div>` : ""}` : "";
  const allDone = Object.entries(st.done).every(([s, v]) => v || (s === "y" && !yahooOn));
  const foot = st.loading ? `<p class="note" style="margin:0;text-align:center">商品を読み込み中…</p>`
    : st.error && !st.items.length ? `<p class="note" style="margin:0">商品を読み込めませんでした。時間をおいてもう一度開いてください。</p>`
    : !allDone ? `<button class="ghost more-btn" data-act="slmore" data-id="${id}">もっと見る（${PER_PAGE}件ずつ）</button>`
    : st.items.length ? `<p class="note" style="margin:0;text-align:center">これで全部です（${st.items.length}件）</p>`
    : `<p class="note" style="margin:0">見つかりませんでした。条件を変えてみてください。</p>`;
  const credits = [...new Set(st.items.map(x => x.src))].map(s => SOURCES[s].credit).join("　") || SOURCES.r.credit;
  el.innerHTML = `${summary}${controls}<div class="rklist">${list.map(rkCard).join("")}</div>
    ${list.length === 0 && st.items.length ? `<p class="note">この条件の商品はまだありません。「もっと見る」で増やせます。</p>` : ""}
    ${foot}<p class="credit">${credits}</p>`;
}

// ---------- 人気ギフトランキング（楽天市場のランキング・毎日更新） ----------
const RANK_GENRES = [["551167","スイーツ"],["510915","お酒"],["100005","花・ガーデン"],["216129","アクセサリー"],["100939","コスメ"],["558929","腕時計"],["558944","キッチン"],["100804","インテリア"],["","総合"]];
const RANK_WHO = [["","すべての人"],["20-1","20代女性"],["20-0","20代男性"],["30-1","30代女性"],["30-0","30代男性"],["40-1","40代女性"],["40-0","40代男性"],["50-1","50代以上女性"],["50-0","50代以上男性"]];
let rankG = load("rankG", "551167"), rankW = "";
const RANKS = {};   // 条件ごとに {items, page, done, loading, error, updated}
const rankKey = () => rankG + "|" + rankW;
const rankState = () => RANKS[rankKey()] || (RANKS[rankKey()] = {items: [], page: 0, done: false, loading: false, error: false, updated: ""});
function rankLoad(){
  const st = rankState();
  if (st.loading || st.done) return;
  st.loading = true; rankDraw();
  const page = st.page + 1, p = {page};
  if (rankG) p.genreId = rankG;
  if (rankW) { const [a, s] = rankW.split("-"); p.age = a; p.sex = s; }
  // ランキングは毎日変わるので、覚えておくのは1時間だけ
  const cacheKey = "rkc-rank" + JSON.stringify(p), hit = load(cacheKey, null);
  const get = hit && Date.now() - hit.t < 3600000 ? Promise.resolve(hit.d)
    : enqueue("r", () => apiGet("/ranking", p), true).then(d => { save(cacheKey, {t: Date.now(), d}); return d; });
  get.then(d => {
    const items = (d.Items || []).map(it => norm(it, "r"));
    const seen = new Set(st.items.map(x => x.itemUrl));
    st.items.push(...items.filter(x => !seen.has(x.itemUrl)));
    st.items.sort((a, b) => a.rank - b.rank);   // 楽天からは逆順で届くことがあるので、1位から並べ直す
    st.page = page; st.done = !items.length || page >= 34; st.updated = d.lastBuildDate || st.updated;
  }).catch(() => { st.error = true; st.done = true; })
    .finally(() => { st.loading = false; rankDraw(); });
}
const rankPills = () => RANK_GENRES.map(([g, n]) => `<button class="pill" data-act="rkg" data-v="${g}" aria-pressed="${rankG === g}">${n}</button>`).join("");
function fmtUpd(s){
  const d = new Date(s);
  return isNaN(d) ? s : `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

//   {k:"v:動画ID" または "a:記事URL", type:"v"|"a", title, url, img, sub}
let favx = load("favx", []);
const isFavx = k => favx.some(f => f.k === k);
const trReg = [];   // 画面に出した動画・記事（♡ボタン用）
const TOPIC_BASE = ["誕生日プレゼント","クリスマス","バレンタイン","ホワイトデー","母の日","父の日","敬老の日","結婚祝い","出産祝い","手土産","お歳暮"];
const trTopics = () => { const n = upcoming()[0].n; return [...new Set([TOPIC_BASE.includes(n) ? n : null, ...TOPIC_BASE].filter(Boolean))]; };
let trTopic = null, trTab = "video";
const topicQuery = t => /プレゼント|ギフト|手土産|祝い|お歳暮|お中元/.test(t) ? t : t + " プレゼント";
const TR = {};   // 「種類|話題」ごとに {items, loading, error, disabled, next}
function trState(kind, topic){
  // 急上昇の商品はジャンルごと、話題のワードは1つだけ
  const k = kind + "|" + (kind === "rise" ? "g" + rankG : kind === "words" ? "-" : topic); return TR[k] || (TR[k] = {items: [], loading: false, error: false, disabled: false, next: "", loaded: false}); }
function trLoad(kind, topic, more = false){
  const st = trState(kind, topic);
  if (st.loading || (st.loaded && !more)) return;
  const p = kind === "video" ? {q: topicQuery(topic) + " 紹介", ...(more && st.next ? {pageToken: st.next} : {})}
          : kind === "article" ? {q: topicQuery(topic)}
          : kind === "rise" ? {period: "realtime", page: 1, ...(rankG ? {genreId: rankG} : {})}
          : {type: "up"};
  const path = {video: "/youtube", article: "/articles", rise: "/ranking", words: "/trendwords"}[kind];
  // 3時間はこの端末で覚えておく
  const cacheKey = "rkc-tr" + path + JSON.stringify(p), hit = load(cacheKey, null);
  st.loading = true; trDraw();
  const get = hit && Date.now() - hit.t < 10800000 ? Promise.resolve(hit.d)
    : (kind === "rise" ? enqueue("r", () => apiGet(path, p), true) : apiGet(path, p)).then(d => { save(cacheKey, {t: Date.now(), d}); return d; });
  get.then(d => {
    if (d.disabled) { st.disabled = true; return; }
    const items = kind === "rise" ? (d.Items || []).map(it => norm(it, "r")).sort((a, b) => a.rank - b.rank) :kind === "words" ? (d.words || []) : (d.items || []);
    st.items.push(...items); st.next = d.next || "";
  }).catch(() => { st.error = true; })
    .finally(() => { st.loading = false; st.loaded = true; trDraw(); });
}

const VI = {};   // 動画ごとに {items, loading, error, disabled, loaded}
function viLoad(id){
  const st = VI[id] || (VI[id] = {items: [], loading: false, error: false, disabled: false, loaded: false});
  if (st.loading || st.loaded) return viDraw(id);
  const cacheKey = "rkc-vi2" + id, hit = load(cacheKey, null);
  st.loading = true; viDraw(id);
  const get = hit && Date.now() - hit.t < 86400000 ? Promise.resolve(hit.d)
    : apiGet("/videoitems", {id}).then(d => { save(cacheKey, {t: Date.now(), d}); return d; });
  get.then(d => {
    if (d.disabled) { st.disabled = true; return; }
    if (d.video) VIDS[id] = {...(VIDS[id] || {}), ...d.video};
    st.items = (d.items || []).map(x => ({...x, item: x.item ? norm(x.item, "r") : null}));
  }).catch(() => { st.error = true; })
    .finally(() => { st.loading = false; st.loaded = true; viDraw(id); });
}

  return `<div class="bar pad" style="grid-template-columns:44px 1fr 44px"><div></div><h1>いま話題</h1>${wishBtn()}</div><div class="pad">
    <p class="note" style="margin:0 0 10px">YouTubeの紹介動画や、ネットで話題の記事から、プレゼント選びのヒントを集めました。♡でお気に入りに保存できます。</p>
    ${trTab === "rise" || trTab === "words" ? "" : `<div class="sortbar">${trTopics().map(t => `<button class="pill" data-act="trtopic" data-v="${esc(t)}" aria-pressed="${t === topic}">${esc(t)}</button>`).join("")}</div>`}
    <div class="seg4">${TR_TABS.filter(([k]) => !(k === "words" && wordsOff)).map(([k, n]) => `<button class="pill" data-act="trtab" data-v="${k}" aria-pressed="${trTab === k}">${n}</button>`).join("")}</div>
    ${trTab === "rise" ? `<p class="note" style="margin:8px 0">楽天市場で、いま売れている商品（リアルタイム）</p><div class="sortbar">${rankPills()}</div>` : ""}
    <div id="trbox" style="margin-top:12px"></div>
  </div>`;
};

// 画面に出ている候補に写真をはめこむ
function hydratePhotos(root = document){
  const put = (el, d) => {
    const u = d.items[0] && d.items[0].img;
    if (u && el.isConnected && !el.querySelector("img.ph")) el.insertAdjacentHTML("afterbegin", `<img class="ph" src="${esc(u)}" alt="" loading="lazy">`);
  };
  const need = el => () => el.isConnected;
  // ギフトの候補ごとの写真
  root.querySelectorAll("[data-photo]").forEach(el => giftItems(GIFTS[+el.dataset.photo], need(el)).then(d => put(el, d)).catch(() => {}));
  // シーンや看板の写真
  root.querySelectorAll("[data-kw]").forEach(el => rkSearch({keyword: el.dataset.kw, sort: "-reviewCount", page: 1}, need(el)).then(d => put(el, d)).catch(() => {}));
}

// 画面に出ている候補に写真をはめこみ、商品の一覧やランキングを読み込む
function hydrate(){
  if (!RK.ready()) return;
  hydratePhotos();
  const topic = trTopic || trTopics()[0];
  if (document.getElementById("trbox")) { trLoad(trTab, topic); trDraw(); }
  if (document.getElementById("vitems")) viLoad(cur().id);
  if (document.getElementById("hometrend")) { trLoad("video", topic); trDraw(); }
  if (document.getElementById("rankrow") || document.getElementById("ranklist")) {
    const st = rankState();
    st.page === 0 && !st.done ? rankLoad() : rankDraw();
  }
  // 商品の一覧
  document.querySelectorAll(".shoplist").forEach(el => SL[el.id].items.length || SL[el.id].done.r ? slDraw(el.id) : slMore(el.id));
}

// ================= 描画 =================
function render(scrollTop){
  const c = cur();
  document.getElementById("app").innerHTML = V[c.s](c);
  // 下のタブ（スプラッシュでは出さない）
  const tb = document.getElementById("tabbar");
  tb.hidden = c.s === "splash";
  document.getElementById("app").style.paddingBottom = c.s==="splash" ? "0" : "";
  const root = stack[0].s;
  const active = {home:"home",search:"search",trend:"trend",favs:"favs",mypage:"mypage"}[root] || "home";
  tb.innerHTML = [["home","home","ホーム"],["search","search","探す"],["trend","flame","話題"],["favs","heart","お気に入り"],["mypage","user","マイページ"]]
    .map(([s,icon,n])=>`<button data-act="tab" data-s="${s}" ${active===s?'aria-current="page"':""}>${ic(icon)}${n}</button>`).join("");
  if (scrollTop) window.scrollTo(0,0);

  // 入力欄はその都度つなぐ
  [["q-min","min"],["q-max","max"],["q-cat","cat"]].forEach(([id,k]) => {
    const el = document.getElementById(id);
    if (el) el.onchange = e => { q[k] = e.target.value; if (k !== "cat") render(); };
  });
  const who = document.getElementById("rank-who");
  if (who) who.onchange = e => { rankW = e.target.value; render(); };
  const kw = document.getElementById("kw");
  if (kw) kw.oninput = e => q.kw = e.target.value;
  hydrate();
}

function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(()=>el.hidden = true, 1800);
}

// ボタンの操作をまとめて受け取る
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const d = b.dataset, id = +d.id;
  switch (d.act) {
    case "start": save("started", true); tab("home"); break;
    case "back": back(); break;
    case "go": go(d.s); break;
    case "tab": tab(d.s); break;
    case "scene": go("scene", {id:d.id}); break;
    case "detail": go("detail", {id}); break;
    case "list": go("list", {kind:d.kind}); break;
    case "sort": sortMode = d.v; render(); break;
    case "q": q[d.k] = q[d.k]===d.v ? "" : d.v; render(); break;
    case "qr": {
      const same = String(q.min)===d.min && String(q.max)===d.max;
      q.min = same ? "" : d.min; q.max = same ? "" : d.max; render(); break;
    }
    case "kwsearch": Object.assign(q, {kw:d.q, min:"", max:"", cat:"", wrap:""}); go("list", {kind:"search"}); break;
    case "theme": save("theme", d.v); applyTheme(); render(); break;
    case "addanniv": {
      const name = document.getElementById("an-name").value.trim();
      if (!name) { toast("名前を入れてください"); break; }
      annivs = [...annivs, {id: Date.now(), name, m: +document.getElementById("an-m").value, d: +document.getElementById("an-d").value, s: document.getElementById("an-s").value}];
      save("annivs", annivs); toast("登録しました"); render(); break;
    }
    case "delanniv": annivs = annivs.filter(a => a.id !== id); save("annivs", annivs); toast("削除しました"); render(); break;
    case "r": r[d.k] = r[d.k]===d.v ? "" : d.v; render(); break;
    case "fav":
      e.stopPropagation();
      favs = isFav(id) ? favs.filter(x=>x!==id) : [...favs, id];
      save("favs", favs); toast(isFav(id) ? "お気に入りに追加しました" : "お気に入りから外しました"); render(); break;
    // 定番ギフトをほしいものリストへ
    case "wishg": toggleWish({k:"g:"+id, type:"g", id}); render(); break;
    // ショッピングサイトの商品をほしいものリストへ（画面は作り直さず、ボタンだけ切りかえる）
    case "wishr": {
      const it = rkReg[+d.n]; if (!it) break;
      const on = toggleWish({k:"r:"+it.itemUrl, type:"r", src:it.src, name:it.itemName, price:it.itemPrice, url:it.url, img:it.img, shop:it.shopName});
      b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
      document.querySelectorAll(".wishbtn").forEach(x => x.innerHTML = wishInner());
      break;
    }
    // 商品一覧の操作
    case "slmore": slMore(d.id); break;
    case "rkg": rankG = d.v; save("rankG", rankG); render(); break;
    // いま話題
    case "trtopic": trTopic = d.v; render(); break;
    case "video": go("video", {id: d.v}); break;
    case "trtab": trTab = d.v; render(); break;
    case "trmore": trLoad(trTab, trTopic || trTopics()[0], true); break;
    case "favx": {
      const f = trReg[+d.n]; if (!f) break;
      const on = !isFavx(f.k);
      favx = on ? [f, ...favx] : favx.filter(x => x.k !== f.k);
      save("favx", favx); toast(on ? "お気に入りに追加しました" : "お気に入りから外しました");
      // 同じ動画・記事のボタンをまとめて切りかえる（お気に入り画面では一覧を作り直す）
      if (cur().s === "favs" && !on) render();
      else document.querySelectorAll(".favxbtn").forEach(x => { const g = trReg[+x.dataset.n]; if (g && g.k === f.k) { x.classList.toggle("on", on); x.setAttribute("aria-pressed", on); } });
      break;
    }
    case "rkmore": rankLoad(); break;
    case "slsort": { const st = SL[d.id]; if (st && st.sort !== d.v) { st.sort = d.v; slReset(st); slMore(d.id); } break; }
    case "slstar": { const st = SL[d.id]; if (st) { st.star = !st.star; slDraw(d.id); } break; }
    case "slsrc":  { const st = SL[d.id]; if (st) { st.src = d.v; slDraw(d.id); } break; }
    case "wrm": wish = wish.filter(w => w.k !== d.k); save("wish", wish); toast("ほしいものリストから外しました"); render(); break;
  }
});

render();

// ホーム画面に追加したとき、すぐ開けるようにする（対応していないブラウザでは何もしない）
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
